appId: com.portmonitor.app
productName: Port Monitor
copyright: Copyright © 2026 Port Monitor

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: build/tray-icon.png
    to: tray-icon.png
  - from: build/tray-icon-mac.png
    to: tray-icon-mac.png
  - from: build/tray-icon-mac@2x.png
    to: tray-icon-mac@2x.png

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Port Monitor
  runAfterFinish: true
  deleteAppDataOnUninstall: true
  include: build/installer.nsh
  uninstallDisplayName: Port Monitor ${version}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: false
  gatekeeperAssess: false
  # LSUIElement makes it a menu-bar-only app (no dock icon).
  extendInfo:
    LSUIElement: true

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    Name: Port Monitor
    Comment: Realtime port monitor
    Terminal: false
    Type: Application

publish: null
